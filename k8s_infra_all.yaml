# app-deployment.yaml (Frontend, Backend, Services, Ingress, Secrets)

# 1. 네임스페이스 (Namespaces)
apiVersion: v1
kind: Namespace
metadata:
  name: frontend-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: backend-ns
---
# 2. Secret - JWT
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: backend-ns
type: Opaque
data:
  JWT_SECRET_KEY: azhzcGFzcyM=
---
# 2. Secret - TLS (변경 없음)
apiVersion: v1
kind: Secret
metadata:
  name: myweb-tls-secret
  namespace: frontend-ns
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
# 3. Secret - MongoDB Backend User (kevin/k8spass#)
apiVersion: v1
kind: Secret
metadata:
  name: mongo-pass
  namespace: backend-ns
type: Opaque
data:
  password: azhzcGFzcyM=
---
# 4. ConfigMaps (Frontend)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: frontend-ns
data:
  GUESTBOOK_API_ADDR: "http://backend-external-svc.frontend-ns.svc.cluster.local:8000"
---
# 5. ConfigMaps (Backend)
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: backend-ns
data:
  GUESTBOOK_DB_ADDR: "mongodb://mongodb-0.mongo-svc.db-ns.svc.cluster.local:27017,mongodb-1.mongo-svc.db-ns.svc.cluster.local:27017,mongodb-2.mongo-svc.db-ns.svc.cluster.local:27017/guestbook?replicaSet=rs0"
---
# 6. Services (Frontend, Backend, External)
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: frontend-ns
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: backend-ns
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-external-svc
  namespace: frontend-ns
spec:
  type: ExternalName
  externalName: backend-svc.backend-ns.svc.cluster.local
---
# 7. Deployments (Frontend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: frontend
        image: 192.168.0.227/frontend/frontend:4.0
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: GUESTBOOK_API_ADDR
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: GUESTBOOK_API_ADDR
---
# 8. Deployments (Backend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: backend-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      annotations:
        # 👇 여기에 Linkerd 리소스 어노테이션을 추가합니다.
        config.linkerd.io/proxy-cpu-limit: "100m"
        config.linkerd.io/proxy-cpu-request: "50m"
        config.linkerd.io/proxy-memory-limit: "128Mi"
        config.linkerd.io/proxy-memory-request: "64Mi"
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 mongodb-0.mongo-svc.db-ns 27017; do echo "Waiting for MongoDB..."; sleep 2; done;']
        resources:
          limits:
            cpu: "50m"
            memory: "32Mi"
          requests:
            cpu: "25m"
            memory: "16Mi"
      containers:
      - name: backend
        image: 192.168.0.227/backend/backend:4.2
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: GUESTBOOK_DB_ADDR
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: GUESTBOOK_DB_ADDR
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET_KEY
        - name: DB_USER
          value: "kevin"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-pass
              key: password
        resources:
          requests:
            cpu: 100m
            memory: "100Mi"
          limits:
            cpu: 200m
            memory: "200Mi"
---
# 9. Ingress (변경 없음)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
  namespace: frontend-ns
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - myweb.local
    secretName: myweb-tls-secret
  rules:
  - host: myweb.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-external-svc
            port:
              number: 8000
      - path: /register
        pathType: Exact
        backend:
          service:
            name: backend-external-svc
            port:
              number: 8000
      - path: /login
        pathType: Exact
        backend:
          service:
            name: backend-external-svc
            port:
              number: 8000
      - path: /reviews
        pathType: Exact
        backend:
          service:
            name: backend-external-svc
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 8000
---
# 10. HorizontalPodAutoscaler (HPA)
# ◀ [추가] Backend Deployment를 위한 HPA 리소스
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: backend-ns # ◀ backend-ns 네임스페이스
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend      # ◀ backend Deployment를 타겟으로
  minReplicas: 3 # ◀ 현재 replicas 수인 3으로 설정
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 # ◀ requests(100m)의 50% (평균 50m) 초과 시 확장