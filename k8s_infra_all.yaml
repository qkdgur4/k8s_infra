# 1. 네임스페이스 (Namespaces) - 변경 없음
apiVersion: v1
kind: Namespace
metadata:
  name: frontend-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: backend-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: db-ns
---
# 2. Secret - JWT
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: backend-ns
type: Opaque
data:
  JWT_SECRET_KEY: azhzcGFzcyM=
---
# ◀ [오류 최종 수정] 방금 주신 올바른 키 값으로 교체했습니다.
apiVersion: v1
kind: Secret
metadata:
  name: myweb-tls-secret
  namespace: frontend-ns
type: kubernetes.io/tls
data:
  tls.crt: 
  # ◀ 방금 주신 올바른 값
  tls.key: 
---
# ◀ [추가] 2. MongoDB 노드 간 인증을 위한 키파일 Secret
apiVersion: v1
kind: Secret
metadata:
  name: mongo-keyfile-secret
  namespace: db-ns
type: Opaque
data:
  keyfile: 
---
# 4. ConfigMaps
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: frontend-ns
data:
  GUESTBOOK_API_ADDR: "http://backend-external-svc.frontend-ns.svc.cluster.local:8000"
---
# ◀ [수정] 4. Backend ConfigMap (DB 주소 변경)
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: backend-ns
data:
  # ◀ [핵심] DB 접속 주소를 Replica Set 형태로 변경
  GUESTBOOK_DB_ADDR: "mongodb://mongodb-0.mongo-svc.db-ns.svc.cluster.local:27017,mongodb-1.mongo-svc.db-ns.svc.cluster.local:27017,mongodb-2.mongo-svc.db-ns.svc.cluster.local:27017/guestbook?replicaSet=rs0"
---
# 5. Services
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: frontend-ns
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: backend-ns
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---
# ◀ [수정] 5. DB Service를 Headless Service로 변경
apiVersion: v1
kind: Service
metadata:
  name: mongo-svc
  namespace: db-ns
spec:
  ports:
    - port: 27017
      targetPort: 27017
  clusterIP: None
  selector:
    app: db
---
apiVersion: v1
kind: Service
metadata:
  name: backend-external-svc
  namespace: frontend-ns
spec:
  type: ExternalName
  externalName: backend-svc.backend-ns.svc.cluster.local
---
# 6. Deployments (frontend, backend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: frontend
        image: 192.168.0.227/frontend/frontend:4.0
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: GUESTBOOK_API_ADDR
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: GUESTBOOK_API_ADDR
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: backend-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      # ◀ [수정] DB 확인 대상을 Headless Service의 첫 번째 Pod DNS로 변경
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 mongodb-0.mongo-svc.db-ns 27017; do echo "Waiting for MongoDB..."; sleep 2; done;']
      containers:
      - name: backend
        image: 192.168.0.227/backend/backend:4.0
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: GUESTBOOK_DB_ADDR
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: GUESTBOOK_DB_ADDR
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET_KEY
---
# ◀ [수정] 7. DB Deployment를 StatefulSet으로 변경
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: db-ns
spec:
  serviceName: "mongo-svc"
  replicas: 3
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: mongo:8
          ports:
            - containerPort: 27017
          command:
            - "mongod"
            - "--replSet"
            - "rs0"
            - "--keyFile"
            - "/etc/mongo-keyfile/keyfile"
            - "--bind_ip_all"
            - "--auth"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-keyfile-volume
              mountPath: /etc/mongo-keyfile
              readOnly: true
      volumes:
        - name: mongo-keyfile-volume
          secret:
            secretName: mongo-keyfile-secret
            items:
              - key: keyfile
                path: keyfile
                mode: 0400
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        # ◀ [핵심] 이전에 생성한 StorageClass 이름 지정
        storageClassName: "nfs-storage"
---
# 8. Ingress - 변경 없음
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
  namespace: frontend-ns
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - myweb.local
    secretName: myweb-tls-secret
  rules:
  - host: myweb.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-external-svc
            port:
              number: 8000
      - path: /register
        pathType: Exact
        backend:
          service:
            name: backend-external-svc
            port:
              number: 8000
      - path: /login
        pathType: Exact
        backend:
          service:
            name: backend-external-svc
            port:
              number: 8000
      - path: /reviews
        pathType: Exact
        backend:
          service:
            name: backend-external-svc
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 8000
