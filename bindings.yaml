# bindings.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-group-binding
  namespace: backend-ns # 👈 백엔드 네임스페이스에서
subjects:
- kind: Group
  name: ops             # 👈 "ops" 그룹(O=ops)은
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ops-editor-role  # 👈 "ops-editor-role" 권한을 가짐
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-group-binding
  namespace: backend-ns # 👈 백엔드 네임스페이스에서
subjects:
- kind: Group
  name: dev             # 👈 "dev" 그룹(O=dev)은
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: dev-reader-role  # 👈 "dev-reader-role" 권한을 가짐
  apiGroup: rbac.authorization.k8s.io
